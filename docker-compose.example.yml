services:
  db:
    image: mysql:8.0
    container_name: interview-db
    environment:
      MYSQL_DATABASE: ai_interview_ds
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-nzy333}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "13307:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - interview-network

  redis:
    image: redis:7-alpine
    container_name: interview-redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data
    networks:
      - interview-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: interview-qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_data:/qdrant/storage
    networks:
      - interview-network

  embedding-service:
    build:
      context: ./embedding-service
    container_name: interview-embedding-service
    environment:
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-intfloat/multilingual-e5-base}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      EMBEDDING_NORMALIZE: ${EMBEDDING_NORMALIZE:-true}
      HF_HOME: /models/huggingface
    volumes:
      - ./embedding_model_cache:/models/huggingface
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()\""]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s
    networks:
      - interview-network

  backend:
    build:
      context: ./backend
    container_name: interview-backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      embedding-service:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/${DB_NAME:-ai_interview_ds}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      DB_USERNAME: ${DB_USERNAME:-nzy333}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SIGN_KEY: ${JWT_SIGN_KEY}
      JWT_EXPIRE_MS: ${JWT_EXPIRE_MS:-86400000}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QDRANT_ENABLED: ${QDRANT_ENABLED:-true}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-interview_atoms_e5_base}
      QDRANT_VECTOR_SIZE: ${QDRANT_VECTOR_SIZE:-768}
      QDRANT_CONNECT_TIMEOUT_MS: ${QDRANT_CONNECT_TIMEOUT_MS:-3000}
      QDRANT_READ_TIMEOUT_MS: ${QDRANT_READ_TIMEOUT_MS:-5000}
      QUESTION_BANK_SEED_FROM_JSON: ${QUESTION_BANK_SEED_FROM_JSON:-true}
      QUESTION_BANK_REINDEX_ON_STARTUP: ${QUESTION_BANK_REINDEX_ON_STARTUP:-true}
      APP_RAG_RETRIEVAL_LIMIT: ${APP_RAG_RETRIEVAL_LIMIT:-20}
      APP_RAG_CONTEXT_LIMIT: ${APP_RAG_CONTEXT_LIMIT:-10}
      APP_EMBEDDING_PROVIDER: ${APP_EMBEDDING_PROVIDER:-http}
      APP_EMBEDDING_ENDPOINT: ${APP_EMBEDDING_ENDPOINT:-http://embedding-service:8000/embed}
      APP_EMBEDDING_QUERY_PREFIX: "${APP_EMBEDDING_QUERY_PREFIX:-query:}"
      APP_EMBEDDING_PASSAGE_PREFIX: "${APP_EMBEDDING_PASSAGE_PREFIX:-passage:}"
      APP_EMBEDDING_CONNECT_TIMEOUT_MS: ${APP_EMBEDDING_CONNECT_TIMEOUT_MS:-3000}
      APP_EMBEDDING_READ_TIMEOUT_MS: ${APP_EMBEDDING_READ_TIMEOUT_MS:-10000}
      MAIL_HOST: ${MAIL_HOST:-smtp.qq.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      APP_ADMIN_TOKEN: ${APP_ADMIN_TOKEN}
      APP_ANALYTICS_HASH_SALT: ${APP_ANALYTICS_HASH_SALT:-local-analytics-salt}
      APP_RATE_LIMIT_ENABLED: ${APP_RATE_LIMIT_ENABLED:-true}
      APP_QUOTA_ENABLED: ${APP_QUOTA_ENABLED:-true}
      APP_DAILY_INTERVIEW_LIMIT: ${APP_DAILY_INTERVIEW_LIMIT:-5}
      APP_DAILY_AI_CHAT_TURN_LIMIT: ${APP_DAILY_AI_CHAT_TURN_LIMIT:-80}
      APP_DAILY_RESUME_PARSE_LIMIT: ${APP_DAILY_RESUME_PARSE_LIMIT:-3}
      APP_DAILY_MENTOR_GENERATE_LIMIT: ${APP_DAILY_MENTOR_GENERATE_LIMIT:-3}
      APP_DEVELOPER_EXEMPT_USER_IDS: ${APP_DEVELOPER_EXEMPT_USER_IDS:-}
      APP_DEVELOPER_EXEMPT_USERNAMES: ${APP_DEVELOPER_EXEMPT_USERNAMES:-}
      APP_DEVELOPER_EXEMPT_EMAILS: ${APP_DEVELOPER_EXEMPT_EMAILS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    networks:
      - interview-network

  frontend:
    build:
      context: ./frontend
    container_name: interview-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - interview-network

networks:
  interview-network:
    driver: bridge
