services:
  db:
    image: mysql:8.0
    container_name: interview-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - ./mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - interview-network

  redis:
    image: redis:7-alpine
    container_name: interview-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - interview-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: interview-qdrant
    restart: unless-stopped
    volumes:
      - ./qdrant_data:/qdrant/storage
    networks:
      - interview-network

  embedding-service:
    build:
      context: ./embedding-service
    container_name: interview-embedding-service
    restart: unless-stopped
    environment:
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-intfloat/multilingual-e5-base}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      EMBEDDING_NORMALIZE: ${EMBEDDING_NORMALIZE:-true}
      HF_HOME: /models/huggingface
    volumes:
      - ./embedding_model_cache:/models/huggingface
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()\""]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s
    networks:
      - interview-network

  backend:
    build:
      context: ./backend
    container_name: interview-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      embedding-service:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/${DB_NAME}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SIGN_KEY: ${JWT_SIGN_KEY}
      JWT_EXPIRE_MS: ${JWT_EXPIRE_MS:-86400000}
      APP_LLM_CONFIG_ENCRYPTION_KEY: ${APP_LLM_CONFIG_ENCRYPTION_KEY}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QDRANT_ENABLED: ${QDRANT_ENABLED:-true}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-interview_atoms_e5_base}
      QDRANT_VECTOR_SIZE: ${QDRANT_VECTOR_SIZE:-768}
      QDRANT_CONNECT_TIMEOUT_MS: ${QDRANT_CONNECT_TIMEOUT_MS:-3000}
      QDRANT_READ_TIMEOUT_MS: ${QDRANT_READ_TIMEOUT_MS:-5000}
      QUESTION_BANK_SEED_FROM_JSON: ${QUESTION_BANK_SEED_FROM_JSON:-true}
      QUESTION_BANK_REINDEX_ON_STARTUP: ${QUESTION_BANK_REINDEX_ON_STARTUP:-true}
      APP_QUESTION_BANK_USER_MAINTENANCE_ENABLED: ${APP_QUESTION_BANK_USER_MAINTENANCE_ENABLED:-false}
      APP_RAG_RETRIEVAL_LIMIT: ${APP_RAG_RETRIEVAL_LIMIT:-20}
      APP_RAG_RETRIEVAL_LIMIT_MAX: ${APP_RAG_RETRIEVAL_LIMIT_MAX:-30}
      APP_RAG_CONTEXT_LIMIT: ${APP_RAG_CONTEXT_LIMIT:-10}
      APP_RAG_HIGH_CONFIDENCE_SCORE: ${APP_RAG_HIGH_CONFIDENCE_SCORE:-0.70}
      APP_RAG_MIN_CONTEXT_SCORE: ${APP_RAG_MIN_CONTEXT_SCORE:-0.55}
      APP_INTERVIEW_AGENT_ENABLED: ${APP_INTERVIEW_AGENT_ENABLED:-true}
      APP_INTERVIEW_AGENT_PLANNING_TIMEOUT_SECONDS: ${APP_INTERVIEW_AGENT_PLANNING_TIMEOUT_SECONDS:-35}
      APP_INTERVIEW_AGENT_MAX_TOOL_CALLS: ${APP_INTERVIEW_AGENT_MAX_TOOL_CALLS:-3}
      APP_INTERVIEW_AGENT_FALLBACK_ENABLED: ${APP_INTERVIEW_AGENT_FALLBACK_ENABLED:-true}
      APP_EMBEDDING_PROVIDER: ${APP_EMBEDDING_PROVIDER:-http}
      APP_EMBEDDING_ENDPOINT: ${APP_EMBEDDING_ENDPOINT:-http://embedding-service:8000/embed}
      APP_EMBEDDING_QUERY_PREFIX: "${APP_EMBEDDING_QUERY_PREFIX:-query:}"
      APP_EMBEDDING_PASSAGE_PREFIX: "${APP_EMBEDDING_PASSAGE_PREFIX:-passage:}"
      APP_EMBEDDING_CONNECT_TIMEOUT_MS: ${APP_EMBEDDING_CONNECT_TIMEOUT_MS:-3000}
      APP_EMBEDDING_READ_TIMEOUT_MS: ${APP_EMBEDDING_READ_TIMEOUT_MS:-10000}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      APP_UPLOAD_DIR: /app/uploads
      APP_ANALYTICS_HASH_SALT: ${APP_ANALYTICS_HASH_SALT}
      APP_RATE_LIMIT_ENABLED: ${APP_RATE_LIMIT_ENABLED:-true}
      APP_DEVELOPER_EXEMPT_USER_IDS: ${APP_DEVELOPER_EXEMPT_USER_IDS:-}
      APP_DEVELOPER_EXEMPT_USERNAMES: ${APP_DEVELOPER_EXEMPT_USERNAMES:-}
      APP_DEVELOPER_EXEMPT_EMAILS: ${APP_DEVELOPER_EXEMPT_EMAILS:-}
    volumes:
      - ./uploads:/app/uploads
    networks:
      - interview-network

  frontend:
    build:
      context: ./frontend
    container_name: interview-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_HTTP_BIND:-80}:80"
    networks:
      - interview-network

  caddy:
    image: caddy:2-alpine
    container_name: interview-caddy
    restart: unless-stopped
    profiles:
      - https
    depends_on:
      - frontend
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy_data:/data
      - ./caddy_config:/config
    networks:
      - interview-network

networks:
  interview-network:
    driver: bridge
